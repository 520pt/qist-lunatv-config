name: Update LunaTV config

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_lunatv_config.py"
      - ".github/workflows/update-lunatv-config.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate LunaTV config
        run: python3 scripts/update_lunatv_config.py

      - name: Verify generated config
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('LunaTV-config.json').read_text(encoding='utf-8'))
          assert data['cache_time'] == 7200
          assert len(data['api_site']) > 0
          assert Path('LunaTV-config.txt').read_text(encoding='utf-8').strip()
          print('sites=', len(data['api_site']))
          PY

      - name: Commit changes
        run: |
          if git diff --quiet -- LunaTV-config.txt LunaTV-config.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LunaTV-config.txt LunaTV-config.json
          git commit -m "Update LunaTV config"
          git push
